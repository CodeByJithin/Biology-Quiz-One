<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Platform</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success-color: #10b981;
            --success-bg: #d1fae5;
            --danger-color: #ef4444;
            --danger-bg: #fee2e2;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            padding: 32px;
            overflow: hidden;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Screen 1: Registration */
        .welcome-screen {
            text-align: center;
        }

        .welcome-screen h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .welcome-screen p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* Buttons */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        /* Screen 2: Quiz */
        .quiz-header {
            margin-bottom: 20px;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 20px 0 16px 0;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f9fafb;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: #f0f5ff;
        }

        .option-prefix {
            font-weight: 600;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .option-btn.correct {
            background-color: var(--success-bg);
            border-color: var(--success-color);
            color: #065f46;
        }

        .option-btn.correct .option-prefix {
            background-color: var(--success-color);
            color: white;
        }

        .option-btn.incorrect {
            background-color: var(--danger-bg);
            border-color: var(--danger-color);
            color: #991b1b;
        }

        .option-btn.incorrect .option-prefix {
            background-color: var(--danger-color);
            color: white;
        }

        .feedback-box {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .feedback-box.correct {
            display: block;
            background-color: var(--success-bg);
            border: 1px solid var(--success-color);
            color: #065f46;
        }

        .feedback-box.incorrect {
            display: block;
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-color);
            color: #991b1b;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .next-btn-container {
            display: none;
        }

        .next-btn-container.active {
            display: block;
        }

        /* Screen 3: Scorecard */
        .scorecard {
            text-align: center;
        }

        .scorecard h2 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #eef2ff;
            border: 6px solid var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
        }

        .score-circle .percentage {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .score-circle .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0 24px 0;
        }

        .stat-card {
            background: #f9fafb;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-card .number {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .performance-msg {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .error-msg {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Student Registration Screen -->
        <div id="welcome-screen" class="screen active welcome-screen">
            <h1>Biology Quiz</h1>
            <p>Test your knowledge on plant reproduction processes!</p>
            <div class="input-group">
                <label for="student-name">Enter Your Name</label>
                <input type="text" id="student-name" placeholder="e.g. Alex Smith" autocomplete="off">
                <div id="name-error" class="error-msg">Please enter your name to start the quiz.</div>
            </div>
            <button id="start-btn" class="btn">Start Quiz</button>
        </div>

        <!-- 2 & 3. Quiz Interface & Feedback -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="quiz-info">
                    <span id="question-count">Question 1 of 6</span>
                    <span id="score-tracker">Score: 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>

            <div id="question-text" class="question-title"></div>
            <div id="options-container" class="options-list"></div>

            <div id="feedback-box" class="feedback-box">
                <div id="feedback-title" class="feedback-title"></div>
                <div id="feedback-text"></div>
            </div>

            <div id="next-btn-container" class="next-btn-container">
                <button id="next-btn" class="btn">Next Question</button>
            </div>
        </div>

        <!-- 4 & 5. Final Scorecard & Restart -->
        <div id="results-screen" class="screen scorecard">
            <h2>Quiz Completed!</h2>
            <p id="student-display-name">Great effort!</p>

            <div class="score-circle">
                <span id="score-percentage" class="percentage">0%</span>
                <span class="label">Score</span>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div id="total-qs" class="number">6</div>
                    <div class="stat-label">Total Questions</div>
                </div>
                <div class="stat-card">
                    <div id="correct-count" class="number" style="color: var(--success-color);">0</div>
                    <div class="stat-label">Correct</div>
                </div>
                <div class="stat-card">
                    <div id="incorrect-count" class="number" style="color: var(--danger-color);">0</div>
                    <div class="stat-label">Incorrect</div>
                </div>
                <div class="stat-card">
                    <div id="final-score" class="number" style="color: var(--primary-color);">0/6</div>
                    <div class="stat-label">Final Score</div>
                </div>
            </div>

            <div id="performance-msg" class="performance-msg"></div>

            <button id="restart-btn" class="btn">Restart Quiz</button>
        </div>
    </div>

    <script>
        // Quiz Data extracted directly from the uploaded images
        const quizData = [
            {
                id: 1,
                question: "Which structure reaches the stigma during pollination?",
                options: [
                    "Pollen grain",
                    "Zygote",
                    "Pollen tube",
                    "Ovule"
                ],
                correctIndex: 0,
                explanation: "Pollen grains are transferred from the anther to the stigma."
            },
            {
                id: 2,
                question: "Which structure develops from the pollen grain and grows through the style?",
                options: [
                    "Pollen tube",
                    "Ovary",
                    "Zygote",
                    "Ovule"
                ],
                correctIndex: 0,
                explanation: "The pollen grain germinates and forms a pollen tube."
            },
            {
                id: 3,
                question: "Which gamete travels through the pollen tube towards the egg?",
                options: [
                    "Female gamete",
                    "Embryo",
                    "Male gamete",
                    "Zygote"
                ],
                correctIndex: 2,
                explanation: "The male gamete travels through the pollen tube towards the egg."
            },
            {
                id: 4,
                question: "What is the fusion of male and female gametes called?",
                options: [
                    "Seed formation",
                    "Pollination",
                    "Germination",
                    "Fertilisation"
                ],
                correctIndex: 3,
                explanation: "Fertilisation is the fusion of male and female gametes."
            },
            {
                id: 5,
                question: "Which of the following are the gametes involved in fertilisation?",
                options: [
                    "Zygote",
                    "Male gamete",
                    "Female gamete (egg)",
                    "Embryo"
                ],
                // Question 5 in original images highlights Male gamete & Female gamete (egg). 
                // For a single-selection structure: target the primary female gamete option or set correct index.
                correctIndex: 2, 
                explanation: "The male gamete fuses with the female gamete (egg)."
            },
            {
                id: 6,
                question: "What is the fertilised egg called?",
                options: [
                    "Embryo",
                    "Zygote",
                    "Ovule",
                    "Pollen grain"
                ],
                correctIndex: 1,
                explanation: "The fertilised egg is called a zygote."
            }
        ];

        // State variables
        let currentQuestionIndex = 0;
        let score = 0;
        let studentName = "";

        // DOM Elements
        const welcomeScreen = document.getElementById("welcome-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultsScreen = document.getElementById("results-screen");

        const studentNameInput = document.getElementById("student-name");
        const nameError = document.getElementById("name-error");
        const startBtn = document.getElementById("start-btn");

        const questionCount = document.getElementById("question-count");
        const scoreTracker = document.getElementById("score-tracker");
        const progressBar = document.getElementById("progress-bar");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const feedbackTitle = document.getElementById("feedback-title");
        const feedbackText = document.getElementById("feedback-text");
        const nextBtnContainer = document.getElementById("next-btn-container");
        const nextBtn = document.getElementById("next-btn");

        const studentDisplayName = document.getElementById("student-display-name");
        const scorePercentage = document.getElementById("score-percentage");
        const totalQsDisplay = document.getElementById("total-qs");
        const correctCountDisplay = document.getElementById("correct-count");
        const incorrectCountDisplay = document.getElementById("incorrect-count");
        const finalScoreDisplay = document.getElementById("final-score");
        const performanceMsg = document.getElementById("performance-msg");
        const restartBtn = document.getElementById("restart-btn");

        // Event Listeners
        startBtn.addEventListener("click", startQuiz);
        nextBtn.addEventListener("click", goToNextQuestion);
        restartBtn.addEventListener("click", restartQuiz);

        // Start Quiz
        function startQuiz() {
            studentName = studentNameInput.value.trim();
            if (!studentName) {
                nameError.style.display = "block";
                return;
            }
            nameError.style.display = "none";

            currentQuestionIndex = 0;
            score = 0;

            welcomeScreen.classList.remove("active");
            quizScreen.classList.add("active");

            loadQuestion();
        }

        // Load Current Question
        function loadQuestion() {
            const currentQ = quizData[currentQuestionIndex];

            // Reset UI states
            feedbackBox.className = "feedback-box";
            feedbackBox.style.display = "none";
            nextBtnContainer.classList.remove("active");
            optionsContainer.innerHTML = "";

            // Update Progress & Tracker
            const total = quizData.length;
            questionCount.textContent = `Question ${currentQuestionIndex + 1} of ${total}`;
            scoreTracker.textContent = `Score: ${score}`;
            const progressPercent = ((currentQuestionIndex) / total) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Display Question
            questionText.textContent = currentQ.question;

            // Render Option Buttons
            const labels = ["A", "B", "C", "D"];
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `
                    <span class="option-prefix">${labels[index]}</span>
                    <span>${opt}</span>
                `;
                btn.addEventListener("click", () => selectAnswer(index));
                optionsContainer.appendChild(btn);
            });
        }

        // Handle Answer Selection
        function selectAnswer(selectedIndex) {
            const currentQ = quizData[currentQuestionIndex];
            const optionButtons = optionsContainer.querySelectorAll(".option-btn");

            // Disable all options after selection
            optionButtons.forEach(btn => btn.disabled = true);

            const isCorrect = selectedIndex === currentQ.correctIndex;

            if (isCorrect) {
                score++;
                scoreTracker.textContent = `Score: ${score}`;
                optionButtons[selectedIndex].classList.add("correct");
                feedbackBox.className = "feedback-box correct";
                feedbackTitle.textContent = "Correct Answer!";
            } else {
                optionButtons[selectedIndex].classList.add("incorrect");
                optionButtons[currentQ.correctIndex].classList.add("correct");
                feedbackBox.className = "feedback-box incorrect";
                feedbackTitle.textContent = "Wrong Answer!";
            }

            feedbackText.textContent = currentQ.explanation;
            feedbackBox.style.display = "block";

            // Update progress bar to include current completed question
            const total = quizData.length;
            const progressPercent = ((currentQuestionIndex + 1) / total) * 100;
            progressBar.style.width = `${progressPercent}%`;

            nextBtnContainer.classList.add("active");
        }

        // Go to Next Question or Show Results
        function goToNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Display Scorecard
        function showResults() {
            quizScreen.classList.remove("active");
            resultsScreen.classList.add("active");

            const total = quizData.length;
            const percentage = Math.round((score / total) * 100);
            const incorrect = total - score;

            studentDisplayName.textContent = `Great effort, ${studentName}!`;
            scorePercentage.textContent = `${percentage}%`;
            totalQsDisplay.textContent = total;
            correctCountDisplay.textContent = score;
            incorrectCountDisplay.textContent = incorrect;
            finalScoreDisplay.textContent = `${score}/${total}`;

            if (percentage === 100) {
                performanceMsg.textContent = "Outstanding! Perfect Score!";
            } else if (percentage >= 70) {
                performanceMsg.textContent = "Great job! You have a solid understanding of the concepts.";
            } else if (percentage >= 50) {
                performanceMsg.textContent = "Good try! Review the concepts and try again for a higher score.";
            } else {
                performanceMsg.textContent = "Keep practicing! Review the materials and attempt the quiz again.";
            }
        }

        // Restart Quiz
        function restartQuiz() {
            studentNameInput.value = "";
            resultsScreen.classList.remove("active");
            welcomeScreen.classList.add("active");
        }
    </script>
</body>
</html>
